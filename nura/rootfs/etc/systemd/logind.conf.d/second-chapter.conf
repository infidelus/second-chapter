# Second Chapter: KOReader handles the Power button itself (short press:
# sleep and wake; hold: a Switch off / Restart menu), so the login manager
# leaves the buttons alone. This also means KOReader doesn't have to wait for
# the login manager at start-up.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
